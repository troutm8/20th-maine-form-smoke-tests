name: Nightly enlistment form smoke test

on:
  schedule:
    # 10:17 UTC = 3:17 AM Pacific (daylight time) / 2:17 AM Pacific (standard time)
    - cron: '17 10 * * *'
  workflow_dispatch:
    inputs:
      submit:
        description: 'Also send ONE real submission (emails all 12 officers)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests (no submissions)
        run: npm run test:nightly

      - name: Run real submission test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.submit }}
        env:
          SUBMIT_TEST: '1'
        run: npx playwright test tests/submit.spec.ts --project=desktop

      # The HTML report (screenshots, video and a step-by-step trace for any
      # failure) is kept for 14 days on the run's summary page.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

# Failure email: GitHub emails you automatically when a scheduled workflow
# fails (it goes to whoever last edited the cron line above). Make sure
# Settings > Notifications > Actions has "Email" ticked and
# "Only notify for failed workflows" selected.
